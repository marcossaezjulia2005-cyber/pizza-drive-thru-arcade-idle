<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizza Drive-Thru: Arcade Idle Tycoon</title>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.title = 'ERR: ' + msg + ' @ line ' + line + ' of ' + (url ? url.split('/').pop() : '?');
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Tailwind CSS CDN para utilidad rápida -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 select-none overflow-hidden">

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay HUD -->
    <div id="ui-overlay">
      <!-- Barra superior de recursos y estado -->
      <div class="flex items-center justify-between w-full max-w-6xl mx-auto interactive-ui flex-wrap gap-2">
        
        <!-- Dinero acumulado -->
        <div class="glass-panel px-5 py-2.5 flex items-center gap-3">
          <span class="text-2xl">💵</span>
          <div class="flex flex-col">
            <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Caja</span>
            <span id="hud-money" class="text-2xl font-bold text-emerald-400">$0</span>
          </div>
        </div>

        <!-- Inventario en la Espalda -->
        <div class="glass-panel px-5 py-2.5 flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xl">🎒</span>
            <div class="flex flex-col">
              <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Carga</span>
              <span id="hud-capacity" class="text-lg font-bold text-white">0/5</span>
            </div>
          </div>

          <div class="h-7 w-[1px] bg-slate-700 mx-1"></div>

          <!-- Trigo en mochila -->
          <div class="flex items-center gap-1.5" title="Trigo">
            <span class="text-lg">🌾</span>
            <span id="hud-wheat" class="font-bold text-amber-300">0</span>
          </div>

          <!-- Harina en mochila -->
          <div class="flex items-center gap-1.5" title="Harina">
            <span class="text-lg">🥡</span>
            <span id="hud-flour" class="font-bold text-sky-200">0</span>
          </div>

          <!-- Pizza en mochila -->
          <div class="flex items-center gap-1.5" title="Pizzas preparadas">
            <span class="text-lg">🍕</span>
            <span id="hud-pizza" class="font-bold text-orange-400">0</span>
          </div>

          <!-- Tomates en mochila -->
          <div class="flex items-center gap-1.5" title="Tomates">
            <span class="text-lg">🍅</span>
            <span id="hud-tomato" class="font-bold text-red-400">0</span>
          </div>

          <!-- Queso en mochila -->
          <div class="flex items-center gap-1.5" title="Queso">
            <span class="text-lg">🧀</span>
            <span id="hud-cheese" class="font-bold text-yellow-300">0</span>
          </div>
        </div>

        <!-- Botones de Utilidad y Modo Turbo -->
        <div class="flex items-center gap-2.5">
          <!-- Botón Modo Turbo -->
          <button id="turbo-btn" class="glass-panel px-4 py-2 flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-600 hover:brightness-110 active:scale-95 transition cursor-pointer shadow-lg shadow-orange-500/30 border-orange-400" title="Doble velocidad de todo durante 10 segundos">
            <span id="turbo-timer-label" class="font-bold text-sm tracking-wide text-white drop-shadow">🔥 ¡TURBO!</span>
          </button>

          <!-- Silenciar audio -->
          <button id="mute-btn" class="glass-panel w-11 h-11 flex items-center justify-center text-xl hover:bg-slate-700 transition" title="Activar/Silenciar Sonido">
            🔊
          </button>

          <!-- Reiniciar partida -->
          <button id="reset-btn" class="glass-panel w-11 h-11 flex items-center justify-center text-base text-slate-400 hover:text-red-400 hover:bg-slate-700 transition" title="Reiniciar partida">
            🔄
          </button>
        </div>
      </div>

      <!-- Ayuda flotante de controles en la esquina inferior derecha -->
      <div class="flex justify-end w-full">
        <div class="glass-panel px-4 py-2 text-xs text-slate-300 flex items-center gap-3 pointer-events-none opacity-90">
          <span>⌨️ <b>WASD</b> o <b>Flechas</b> para moverte</span>
          <span>•</span>
          <span>🌾 Trigo ➔ 🥡 Harina ➔ 🍅 Tomate ➔ 🧀 Queso ➔ 🍕 Horno ➔ 🚗 Drive-Thru</span>
        </div>
      </div>
    </div>

    <!-- Joystick virtual dinámico para pantallas táctiles -->
    <div id="joystick-container">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- Scripts del juego (orden de dependencias) -->
  <script src="js/engine/Audio.js"></script>
  <script src="js/engine/Input.js"></script>
  <script src="js/engine/Camera.js"></script>
  <script src="js/world/Map.js"></script>
  <script src="js/entities/Player.js"></script>
  <script src="js/entities/Stations.js"></script>
  <script src="js/entities/MoneyPickup.js"></script>
  <script src="js/entities/DriveThru.js"></script>
  <script src="js/entities/Employees.js"></script>
  <script src="js/entities/NewIngredients.js"></script>
  <script src="js/systems/Upgrades.js"></script>
  <script src="js/systems/SpecialEvents.js"></script>
  <script src="js/systems/SaveSystem.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
